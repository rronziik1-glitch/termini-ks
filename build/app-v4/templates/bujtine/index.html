<!doctype html>
<html lang="sq" data-fg-loading data-fg-demo>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bujtinë</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#1b2620">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="fg-header head">
    <a class="head__brand" href="#top" data-t="brand.name"></a>
    <nav class="head__nav" aria-label="Kryesore">
      <a href="#dhomat">Dhomat</a>
      <a href="#galeria" data-if="gallery.images">Galeria</a>
      <a href="#pyetje" data-if="faq">Pyetje</a>
      <a href="#lokacioni">Si të vish</a>
    </nav>
    <a class="head__cta" data-cta data-attr="href:links.booking" data-t="booking.label"></a>
  </header>

  <main id="top">

    <!-- HERO -->
    <section class="hero" data-hero>
      <div class="hero__media" data-parallax="0.16">
        <img data-img="hero.image" fetchpriority="high" alt="">
        <video data-video="hero.video" autoplay muted loop playsinline></video>
      </div>
      <div class="hero__shade"></div>
      <div class="hero__body fg-wrap">
        <p class="hero__eyebrow" data-reveal data-t="hero.eyebrow"></p>
        <h1 class="hero__title" data-reveal data-t="hero.title"></h1>
        <p class="hero__sub" data-reveal data-t="hero.subtitle"></p>
        <div class="hero__actions" data-reveal>
          <a class="btn btn--light" data-cta data-attr="href:links.booking"><span data-t="booking.label"></span><i data-icon="arrow"></i></a>
          <a class="btn btn--glass" data-cta data-attr="href:links.whatsapp"><i data-icon="whatsapp"></i>WhatsApp</a>
        </div>
      </div>
    </section>

    <!-- FACTS -->
    <section class="facts" data-if="highlights">
      <ul class="fg-wrap facts__list">
        <template data-each="highlights">
          <li class="fact" data-reveal><strong data-t=".value"></strong><span data-t=".label"></span></li>
        </template>
      </ul>
    </section>

    <!-- ABOUT -->
    <section class="sec about" data-if="about.text">
      <div class="fg-wrap about__grid">
        <div class="about__body">
          <p class="label" data-reveal><span data-t="brand.place"></span></p>
          <h2 class="title" data-reveal data-t="about.title"></h2>
          <p class="about__text" data-reveal data-t="about.text"></p>
        </div>
        <div class="about__media fg-media" data-reveal="clip"><img data-img="about.image" alt=""></div>
        <ul class="amen" data-if="about.points">
          <template data-each="about.points">
            <li data-reveal><i data-icon="check"></i><span data-t="."></span></li>
          </template>
        </ul>
      </div>
    </section>

    <!-- ROOMS -->
    <section class="sec rooms" id="dhomat">
      <div class="fg-wrap">
        <header class="sec__head">
          <p class="label" data-reveal>Ku fle</p>
          <h2 class="title" data-reveal data-t="services.title"></h2>
          <p class="sec__intro" data-if="services.intro" data-reveal data-t="services.intro"></p>
        </header>
        <template data-each="services.groups">
          <div class="rooms__group">
            <h3 class="rooms__name" data-if=".name" data-reveal data-t=".name"></h3>
            <ul class="rooms__list">
              <template data-each=".items">
                <li class="room" data-reveal>
                  <a class="room__link" data-cta data-attr="href:.bookLink">
                    <div class="room__media fg-media">
                      <img data-img=".image" alt="">
                      <em class="room__tag" data-if=".tag" data-t=".tag"></em>
                    </div>
                    <div class="room__body">
                      <div class="room__top">
                        <h4 class="room__title" data-t=".name"></h4>
                        <p class="room__price" data-t=".price"></p>
                      </div>
                      <p class="room__desc" data-if=".description" data-t=".description"></p>
                      <span class="room__go">Rezervo<i data-icon="arrow"></i></span>
                    </div>
                  </a>
                </li>
              </template>
            </ul>
          </div>
        </template>
      </div>
    </section>

    <!-- GALLERY -->
    <section class="sec gallery" id="galeria" data-if="gallery.images">
      <div class="fg-wrap">
        <header class="sec__head">
          <p class="label" data-reveal>Galeria</p>
          <h2 class="title" data-reveal data-t="gallery.title"></h2>
        </header>
      </div>
      <div class="gallery__rail" data-reveal="fade">
        <template data-each="gallery.images">
          <button class="gallery__item fg-media" data-lightbox><img data-img="." alt=""></button>
        </template>
      </div>
    </section>

    <!-- REVIEWS -->
    <section class="sec voices" data-if="reviews.items">
      <div class="fg-wrap">
        <header class="sec__head voices__head">
          <div>
            <p class="label" data-reveal>Mysafirët</p>
            <h2 class="title" data-reveal data-t="reviews.title"></h2>
          </div>
          <p class="voices__score" data-if="reviews.rating" data-reveal>
            <strong data-t="reviews.rating"></strong>
            <span><b aria-hidden="true">★★★★★</b><small data-t="reviews.summary"></small></span>
          </p>
        </header>
        <ul class="voices__list">
          <template data-each="reviews.items">
            <li class="voice" data-reveal>
              <blockquote data-t=".text"></blockquote>
              <cite data-t=".name"></cite>
            </li>
          </template>
        </ul>
      </div>
    </section>

    <!-- FAQ -->
    <section class="sec faq" id="pyetje" data-if="faq">
      <div class="fg-wrap faq__grid">
        <header class="sec__head">
          <p class="label" data-reveal>Mirë me ditë</p>
          <h2 class="title" data-reveal>Para se të nisesh</h2>
        </header>
        <div class="faq__list">
          <template data-each="faq">
            <details class="qa" data-reveal>
              <summary><span data-t=".q"></span><span class="qa__plus" aria-hidden="true"></span></summary>
              <p data-t=".a"></p>
            </details>
          </template>
        </div>
      </div>
    </section>

    <!-- LOCATION -->
    <section class="sec place" id="lokacioni">
      <div class="fg-wrap place__grid">
        <div class="place__info">
          <p class="label" data-reveal>Si të vish</p>
          <h2 class="title" data-reveal data-t="location.title"></h2>
          <a class="place__addr" data-cta data-reveal data-attr="href:links.map">
            <i data-icon="pin"></i>
            <span><span data-t="location.full"></span><small data-if="location.note" data-t="location.note"></small></span>
          </a>
          <dl class="hours" data-reveal>
            <template data-each="location.hours">
              <div><dt data-t=".days"></dt><dd data-t=".time"></dd></div>
            </template>
          </dl>
          <div class="place__actions" data-reveal>
            <a class="btn btn--line" data-cta data-attr="href:links.tel"><i data-icon="phone"></i><span data-t="contact.phoneDisplay"></span></a>
            <a class="btn btn--line" data-cta data-attr="href:links.map"><i data-icon="arrow-up-right"></i>Hap në hartë</a>
          </div>
        </div>
        <div class="fg-map" data-reveal="fade"><iframe title="Harta" loading="lazy" referrerpolicy="no-referrer-when-downgrade" data-attr="src:links.mapEmbed"></iframe></div>
      </div>
    </section>

    <!-- CTA -->
    <section class="cta">
      <div class="fg-wrap cta__in">
        <p class="label" data-reveal>Vende të kufizuara</p>
        <h2 class="cta__title" data-reveal>Mali të pret</h2>
        <p class="cta__text" data-reveal>Na trego datat dhe sa veta jeni. Të përgjigjemi brenda ditës.</p>
        <div class="cta__actions" data-reveal>
          <a class="btn btn--light" data-cta data-attr="href:links.booking"><span data-t="booking.label"></span><i data-icon="arrow"></i></a>
          <a class="btn btn--glass" data-cta data-attr="href:links.tel"><i data-icon="phone"></i><span data-t="contact.phoneDisplay"></span></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="fg-footer foot">
    <div class="fg-wrap foot__in">
      <p class="foot__brand" data-t="brand.name"></p>
      <p class="foot__note" data-if="footer.note" data-t="footer.note"></p>
      <div class="foot__row">
        <a data-cta data-if="links.instagram" data-attr="href:links.instagram"><i data-icon="instagram"></i><span data-t="contact.instagramDisplay"></span></a>
        <a data-cta data-if="links.email" data-attr="href:links.email"><i data-icon="mail"></i><span data-t="contact.email"></span></a>
      </div>
      <p class="foot__legal">© <span data-t="year"></span> <span data-t="brand.name"></span> · <span data-t="location.full"></span></p>
      <a class="fg-credit" href="https://faqjagati.com" rel="noopener">Faqe nga <b>Faqja Gati</b></a>
    </div>
  </footer>

  <div class="fg-bar" data-actionbar>
    <a class="fg-bar__btn fg-bar__btn--wa" data-attr="href:links.whatsapp" aria-label="Shkruaj në WhatsApp"><i data-icon="whatsapp"></i></a>
    <a class="fg-bar__btn fg-bar__btn--book" data-attr="href:links.booking"><span data-t="booking.label"></span></a>
  </div>

  <script src="content.js"></script>
  <script src="../fg.js"></script>
</body>
</html>
